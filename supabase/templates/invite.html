<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You have been invited to Gubernator</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #0f172a; padding: 32px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; background-color: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td style="background-color: #0f172a; padding: 24px 32px">
                <span
                  style="
                    color: #f8fafc;
                    font-size: 20px;
                    font-weight: 700;
                    letter-spacing: 0.05em;
                  "
                  >GUBERNATOR</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 32px; color: #1e293b; font-size: 15px; line-height: 1.6">
                <p style="margin: 0 0 16px">
                  You have been invited to join Gubernator as
                  <strong>{{ .Email }}</strong>.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background-color: #0f172a;
                      color: #f8fafc;
                      text-decoration: none;
                      padding: 12px 24px;
                      border-radius: 6px;
                      font-weight: 600;
                    "
                    >Accept invite</a
                  >
                </p>
                <p style="margin: 0; color: #64748b; font-size: 13px">
                  If you were not expecting this invitation, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  background-color: #f8fafc;
                  color: #94a3b8;
                  font-size: 12px;
                  line-height: 1.5;
                  border-top: 1px solid #e2e8f0;
                "
              >
                This is an automated message from Gubernator. If you did not expect this email,
                you can safely ignore it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
