# __SUPABASE_URL__ / __SUPABASE_WS_URL__ are replaced at image build time
# (see docker/app/Dockerfile) with the deployment's Supabase origin so the
# CSP connect-src matches VITE_SUPABASE_URL.
#
# Security headers live at server level and caching uses `expires` (not
# add_header) so the header set is inherited by every location — a
# location-level add_header would silently drop all inherited headers.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Production security header set — keep in sync with README
    # "Production Security Headers".
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __SUPABASE_URL__ __SUPABASE_WS_URL__; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    # Ignored by browsers over plain HTTP, effective once TLS fronts the app.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hashed build assets are immutable
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback for TanStack Router paths
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
